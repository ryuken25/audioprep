name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fyne compiles against X11/GL headers even when no window is opened,
      # so `go vet ./...` and `go test ./...` need them to build the ui
      # package. Fyne 2.8's GLFW also builds its Wayland backend by default,
      # hence libwayland-dev + wayland-protocols. ffmpeg lets the pipeline
      # integration tests run for real instead of being skipped.
      - name: Install build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols ffmpeg
          ffmpeg -version | head -1

      - run: go vet ./...

      - run: go test ./... -count=1

  web:
    name: Web build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
