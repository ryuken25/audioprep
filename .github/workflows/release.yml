name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows .exe and publish release
    runs-on: windows-latest
    defaults:
      run:
        # Every step runs inside the MSYS2 UCRT64 shell so that the gcc we
        # install below is first on PATH when cgo asks for a C compiler.
        # path-type: inherit (set on the msys2 step) keeps Go, git and the
        # runner tools reachable from that shell.
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            zip

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Toolchain check
        run: |
          gcc --version | head -1
          go version

      # ffmpeg on the runner lets the pipeline integration tests run for
      # real; if the install fails we still want the release, so tests fall
      # back to -short (integration tests self-skip when ffmpeg is missing).
      - name: Install ffmpeg (for integration tests)
        shell: pwsh
        continue-on-error: true
        run: choco install ffmpeg -y --no-progress

      - name: Test
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-H windowsgui -s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o dist/audioprep-windows-amd64.exe ./cmd/audioprep
          ls -la dist

      - name: Package zip
        run: |
          cat > dist/README.txt <<'EOF'
          audioprep: audio-first video encoder for X and TikTok
          =====================================================

          1. Run audioprep-windows-amd64.exe
          2. On first launch it offers to download FFmpeg (~170 MB) into
             %APPDATA%\audioprep\bin. Say yes once; later launches skip it.
             (Or put your own ffmpeg.exe + ffprobe.exe next to the .exe.)
          3. Drop a video, pick "X (audio-first)", click Process.

          Windows SmartScreen may warn because the .exe is not code-signed.
          Click "More info" -> "Run anyway".

          Source and docs: https://github.com/ryuken25/audioprep
          EOF
          cd dist
          zip -9 audioprep-windows-amd64.zip audioprep-windows-amd64.exe README.txt
          sha256sum audioprep-windows-amd64.exe audioprep-windows-amd64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact (for workflow_dispatch runs)
        uses: actions/upload-artifact@v4
        with:
          name: audioprep-windows-amd64
          path: |
            dist/audioprep-windows-amd64.exe
            dist/audioprep-windows-amd64.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: audioprep ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/audioprep-windows-amd64.exe
            dist/audioprep-windows-amd64.zip
            dist/SHA256SUMS.txt
